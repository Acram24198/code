<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>CODE</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header><h1>CODE<span>.</span></h1><p>TEXT → CODE</p></header>
    <section aria-labelledby="inputHeading">
      <div class="heading"><h2 id="inputHeading">INPUT</h2><label class="upload" for="imageInput">+ UPLOAD IMAGE</label></div>
      <input id="imageInput" type="file" accept="image/*" capture="environment">
      <div class="preview" id="previewBox" hidden><img id="preview" alt="Uploaded image preview"></div>
      <div class="progress" id="progress" hidden><div id="progressBar"></div></div>
      <label class="sr-only" for="plainText">Text to encode, including text extracted from image</label>
      <textarea id="plainText" spellcheck="false" rows="7" placeholder="Type text or upload an image..."></textarea>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <div class="actions"><button id="encodeBtn" class="primary">ENCODE</button><button id="clearBtn">CLEAR</button></div>
    </section>
    <section aria-labelledby="outputHeading">
      <div class="heading"><h2 id="outputHeading">OUTPUT</h2><span class="meta">NO SHIFT</span></div>
      <div id="output" class="output" aria-label="Encoded output"><p class="placeholder">Encoded text will appear here.</p></div>
      <div class="actions downloads"><button id="pngBtn" disabled>PNG</button><button id="svgBtn" disabled>SVG</button><button id="copyBtn" disabled>COPY</button><button id="pdfBtn" disabled>PRINT / PDF</button></div>
    </section>
    <footer>CODE.JEREMYDOUGLAS.COM</footer>
  </main>
</body>
</html>
